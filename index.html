<script>
const Decrypt=(()=>{
const u32=(b,o)=>b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24>>>0;
function cfb(b){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);const ss=1<<dv.getUint16(30,true),ms=1<<dv.getUint16(32,true);
 const nfat=dv.getUint32(44,true),dir0=dv.getUint32(48,true),cut=dv.getUint32(56,true),mf=dv.getUint32(60,true);
 const sec=i=>b.subarray(512+i*ss,512+(i+1)*ss);
 const difat=[];for(let i=0;i<109;i++){const v=dv.getUint32(76+i*4,true);if(v<0xFFFFFFFA)difat.push(v)}
 let ds=dv.getUint32(68,true),nd=dv.getUint32(72,true);while(nd--&&ds<0xFFFFFFFA){const s=sec(ds),d=new DataView(s.buffer,s.byteOffset,ss);for(let i=0;i<ss/4-1;i++){const v=d.getUint32(i*4,true);if(v<0xFFFFFFFA)difat.push(v)}ds=d.getUint32(ss-4,true)}
 const fat=[];difat.slice(0,nfat).forEach(i=>{const s=sec(i),d=new DataView(s.buffer,s.byteOffset,ss);for(let j=0;j<ss/4;j++)fat.push(d.getUint32(j*4,true))});
 const chain=(s,tab)=>{const r=[];while(s<0xFFFFFFFA&&r.length<1e6){r.push(s);s=tab[s]}return r};
 const rd=s=>{const ch=chain(s,fat),o=new Uint8Array(ch.length*ss);ch.forEach((c,i)=>o.set(sec(c),i*ss));return o};
 const dir=rd(dir0),ents=[];for(let i=0;i<dir.length/128;i++){const e=dir.subarray(i*128,i*128+128),l=e[64]|e[65]<<8;let n='';for(let j=0;j<l/2-1;j++)n+=String.fromCharCode(e[j*2]|e[j*2+1]<<8);ents.push({n,t:e[66],s:u32(e,116),z:u32(e,120)})}
 const root=ents[0],mini=rd(root.s);let mfat=[];if(mf<0xFFFFFFFA){const m=rd(mf),d=new DataView(m.buffer);for(let i=0;i<m.length/4;i++)mfat.push(d.getUint32(i*4,true))}
 return n=>{const e=ents.find(x=>x.n===n&&x.t===2);if(!e)return null;if(e.z<cut){const ch=chain(e.s,mfat),o=new Uint8Array(ch.length*ms);ch.forEach((c,i)=>o.set(mini.subarray(c*ms,(c+1)*ms),i*ms));return o.subarray(0,e.z)}return rd(e.s).subarray(0,e.z)}}
const AL={SHA1:'SHA-1',SHA256:'SHA-256',SHA384:'SHA-384',SHA512:'SHA-512'};
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const le=i=>new Uint8Array([i&255,i>>8&255,i>>16&255,i>>>24]);
async function decrypt(bytes,pw,prog){
 const sub=crypto.subtle;
 if(!(bytes[0]===0xD0&&bytes[1]===0xCF)){return{bytes,encrypted:false}}
 const get=cfb(bytes),info=get('EncryptionInfo'),pkg=get('EncryptedPackage');
 if(!info||!pkg){const e=new Error('File is not a valid Excel workbook.');e.code='layout';throw e}
 if(info[0]!==4||info[2]!==4&&info[2]!==3){const e=new Error('Unsupported encryption type (only Excel 2010+ password encryption is supported).');e.code='layout';throw e}
 const xs=new TextDecoder().decode(info.subarray(8)),tag=n=>{const m=xs.match(new RegExp('<([a-zA-Z]+:)?'+n+'[ \t\r\n][^>]*>'))[0];return{getAttribute:a=>(m.match(new RegExp('[ \t\r\n]'+a+'="([^"]*)"'))||[])[1]}};
 const kd=tag('keyData'),ek=tag('encryptedKey');
 const H=AL[ek.getAttribute('hashAlgorithm')],hash=async d=>new Uint8Array(await sub.digest(H,d));
 const salt=b64(ek.getAttribute('saltValue')),spin=+ek.getAttribute('spinCount'),kb=ek.getAttribute('keyBits')/8,bs=+ek.getAttribute('blockSize');
 const pwb=new Uint8Array(pw.length*2);for(let i=0;i<pw.length;i++){pwb[i*2]=pw.charCodeAt(i)&255;pwb[i*2+1]=pw.charCodeAt(i)>>8}
 let h=await hash(cat(salt,pwb));for(let i=0;i<spin;i++){h=await hash(cat(le(i),h));if(prog&&i%20000===0)prog(i/spin)}
 const aes=async(key,iv,data)=>{const k=await sub.importKey('raw',key,'AES-CBC',false,['decrypt']);const pad=new Uint8Array(await sub.encrypt({name:'AES-CBC',iv:data.subarray(data.length-16)},await sub.importKey('raw',key,'AES-CBC',false,['encrypt']),new Uint8Array(0)));
  return new Uint8Array(await sub.decrypt({name:'AES-CBC',iv},k,cat(data,pad)))};
 const dk=async bk=>{const f=await hash(cat(h,bk));const o=new Uint8Array(kb).fill(0x36);o.set(f.subarray(0,kb));return o};
 const vin=await aes(await dk(new Uint8Array([0xfe,0xa7,0xd2,0x76,0x3b,0x4b,0x9e,0x79])),salt.subarray(0,16),b64(ek.getAttribute('encryptedVerifierHashInput')));
 const vh=await aes(await dk(new Uint8Array([0xd7,0xaa,0x0f,0x6d,0x30,0x61,0x34,0x4e])),salt.subarray(0,16),b64(ek.getAttribute('encryptedVerifierHashValue')));
 const chk=await hash(vin.subarray(0,+ek.getAttribute('saltSize')));
 for(let i=0;i<chk.length;i++)if(chk[i]!==vh[i]){const e=new Error('Wrong password.');e.code='password';throw e}
 const key=(await aes(await dk(new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6])),salt.subarray(0,16),b64(ek.getAttribute('encryptedKeyValue')))).subarray(0,kb);
 const ksalt=b64(kd.getAttribute('saltValue')),size=u32(pkg,0),out=new Uint8Array(Math.ceil((pkg.length-8)/4096)*4096);
 for(let i=0,o=8;o<pkg.length;i++,o+=4096){const seg=pkg.subarray(o,Math.min(o+4096,pkg.length));const iv=(await hash(cat(ksalt,le(i)))).subarray(0,bs);const full=seg.length%16?cat(seg,new Uint8Array(16-seg.length%16)):seg;out.set(await aes(key,iv,full),i*4096)}

const Parse=(()=>{
const nn=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const num=v=>typeof v==='number'&&isFinite(v)?v:(typeof v==='string'&&v.trim()!==''&&isFinite(+v)?+v:null);
const sec=v=>typeof v==='number'?Math.round(v*86400):null;
const dOf=v=>typeof v==='number'?new Date(Math.round((v-25569)*864e5)):null;
const err=(code,msg)=>{const e=new Error(msg);e.code=code;return e};
const PARAMS=[['Critical Error %',7,8,9,'p',1],['Empathy',10,11,12,'p',0],['FCR',13,14,15,'p',0],['Complaint Escalation Accuracy',16,17,18,'p',0],['Service Delivery',19,20,21,'n',0],['Schedule Adherence',22,23,24,'p',0],['Login Compliance',null,28,29,'p',0],['AHT (sec)',30,31,32,'n',1],['CSAT / CFS',33,34,35,'p',0],['Break (extra)',null,37,38,'d',1],['DKB Attendance',null,39,40,'p',0],['Quiz Score',null,41,42,'p',0]];
function parse(XLSX,bytes,log){
 const say=m=>log&&log(m);
 say('Reading workbook');
 const names=XLSX.read(bytes,{type:'array',bookSheets:true}).SheetNames;
 const pick=(pred)=>names.find(n=>pred(nn(n)));
 const S={kpi:pick(n=>n==='kpi'),cfs:pick(n=>n.includes('daywise')&&n.includes('cfs')),aht:pick(n=>n.includes('daywise')&&n.includes('aht')),ce:pick(n=>n.includes('dkb')),fq:pick(n=>n.includes('fcr')),esc:pick(n=>n.includes('escalation')),ort:pick(n=>n==='ort'),att:pick(n=>n.startsWith('attendance'))};
 const warnings=[];
 if(!S.kpi)throw err('missing','Required sheet "KPI" was not found. Sheets in file: '+names.join(', '));
 const want=Object.values(S).filter(Boolean);
 const lab={cfs:'Day Wise CFS Tracker',aht:'Day Wise AHT Tracker',ce:'Quality & DKB report (CE & DKB)',fq:'FCR & Quiz',esc:'Escalation Accuracy',ort:'ORT',att:'Attendance'};
 for(const k in lab)if(!S[k])warnings.push('Sheet missing: '+lab[k]+' – related sections will show no data.');
 say('Parsing sheets');
 const wb=XLSX.read(bytes,{type:'array',sheets:want});
 const R=n=>n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
 const k=R(S.kpi);
 const h0=k.findIndex(r=>r[0]==='ID'&&nn(r[1])==='name');
 if(h0<0)throw err('layout','KPI sheet layout not recognised: header row with "ID" and "Name" not found.');
 const agents=[];let grp='Regular';
 for(let i=h0+1;i<k.length;i++){const r=k[i];
  if(typeof r[0]==='string'){if(/tl\s*kpi/i.test(r[0]))break;if(/ojt/i.test(r[0]))grp='OJT';else if(/regular/i.test(r[0]))grp='Regular';continue}
  if(typeof r[0]!=='number'||typeof r[1]!=='string')continue;
  const kp=PARAMS.map(([nm,t,a,s,f,low])=>({k:nm,t:t==null?null:r[t],v:r[a],s:num(r[s]),f,low}));
  agents.push({id:String(r[0]),name:r[1].trim(),tl:r[2],grp,elig:r[3],roster:num(r[4]),pres:num(r[5]),abs:num(r[6]),kpi:kp,lag:r[27],ready:sec(r[26]),target:sec(r[25]),tot:num(r[43]),score:num(r[44]),final:num(r[45]),grade:r[46],ce:null,dkb:null,fcr:null,quiz:null,ort:null,esc:null,cfs:null,aht:null,att:[]})}
 if(!agents.length)throw err('layout','No agents found in the KPI sheet.');
 const byId={},byName={};agents.forEach(a=>{byId[a.id]=a;byName[nn(a.name)]=a});
 const A=(id,name)=>(id!=null&&byId[String(id).trim()])||byName[nn(name)];
 let monthD=null;
 const c=R(S.cfs);
 if(S.cfs){const h=c.findIndex(r=>r[0]==='ID'&&nn(r[2])==='name');if(h<1)warnings.push('Day Wise CFS Tracker layout not recognised.');else{
  const dr=c[h-1];for(let i=h+1;i<c.length;i++){const r=c[i];if(typeof r[0]!=='number')continue;const a=A(r[0],r[2]);if(!a)continue;
   const days=[];for(let j=7;j+2<r.length;j+=3){const d=dOf(dr[j]);if(!d)continue;days.push({d:d.getUTCDate(),cs:num(r[j])||0,ds:num(r[j+1])||0,sc:num(r[j+2])});if(!monthD)monthD=d}
   a.cfs={m:{cs:num(r[4]),ds:num(r[5]),sc:num(r[6])},days}}}}
 const t=R(S.aht);
 if(S.aht){const h=t.findIndex(r=>r[0]==='ID'&&nn(r[1])==='csaname');if(h<1)warnings.push('Day Wise AHT Tracker layout not recognised.');else{
  const dr=t[h-1];for(let i=h+1;i<t.length;i++){const r=t[i];if(typeof r[0]!=='number')continue;const a=A(r[0],r[1]);if(!a)continue;
   const days=[];for(let j=6;j+2<r.length;j+=3){const d=dOf(dr[j]);if(!d)continue;days.push({d:d.getUTCDate(),st:sec(r[j]),aux:sec(r[j+1]),aht:num(r[j+2])});if(!monthD)monthD=d}

const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DIM=()=>{const[y,m]=D.meta.month.split('-');return new Date(+y,+m,0).getDate()},MON=()=>MONS[+D.meta.month.split('-')[1]-1];

function teamAgent(){const n=DIM(),cd=[],ad=[];let c1=0,c2=0,S1=0,A1=0,H=0,C=0;
 for(let d=1;d<=n;d++){let cs=0,ds=0,st=0,au=0,h=0,c=0,hc=0,ha=0;D.agents.forEach(a=>{const x=a.cfs&&a.cfs.days.find(z=>z.d===d);if(x){cs+=x.cs;ds+=x.ds}const y=a.aht&&a.aht.days.find(z=>z.d===d);if(y){st+=y.st||0;au+=y.aux||0;if(isN(y.aht)&&y.aht>0){const q=(y.st||0)-(y.aux||0);h+=q;c+=q/y.aht}}});
  cd.push({d,cs,ds,sc:cs+ds?cs/(cs+ds):null});ad.push({d,st,aux:au,aht:c?h/c:null});c1+=cs;c2+=ds;S1+=st;A1+=au;H+=h;C+=c}
 return{name:'TEAM TOTAL',cfs:{m:{cs:c1,ds:c2,sc:c1+c2?c1/(c1+c2):null},days:cd},aht:{m:{st:S1,aux:A1,aht:C?H/C:null},days:ad}}}
const WK=[[1,7],[8,14],[15,21],[22,28],[29,31]];
const wkC=(a,w)=>{if(!a.cfs)return null;const x=a.cfs.days.filter(z=>z.d>=w[0]&&z.d<=w[1]),cs=x.reduce((s,z)=>s+z.cs,0),ds=x.reduce((s,z)=>s+z.ds,0);return{cs,ds,sc:cs+ds?cs/(cs+ds):null}};
const wkA=(a,w)=>{if(!a.aht)return null;const x=a.aht.days.filter(z=>z.d>=w[0]&&z.d<=w[1]),st=x.reduce((s,z)=>s+(z.st||0),0),au=x.reduce((s,z)=>s+(z.aux||0),0);let h=0,c=0;x.forEach(z=>{if(isN(z.aht)&&z.aht>0){const q=(z.st||0)-(z.aux||0);h+=q;c+=q/z.aht}});return{st,au,aht:c?h/c:null}};
const scp=sc=>isN(sc)?pill(sc>=.9?'g':sc>=.85?'w':'c',(sc*100).toFixed(1)+'%'):'–',ahp=v=>isN(v)?pill(v<=AHTT?'g':'c',Math.round(v)):'–';

 for(let d=1;d<=n;d++){const f=a=>a.cfs&&a.cfs.days.find(z=>z.d===d),g=a=>a.aht&&a.aht.days.find(z=>z.d===d),P2='D'+d+' ';
  dc.push({h:'CSAT',hx:P2+'CSAT',v:a=>f(a)?f(a).cs:null},{h:'DSAT',hx:P2+'DSAT',v:a=>f(a)?f(a).ds:null},{h:'Score',hx:P2+'Score',v:a=>f(a)&&isN(f(a).sc)?Math.round(f(a).sc*1000)/10:null,r:a=>{const x=f(a);return x&&x.cs+x.ds>0?scp(x.sc):'–'}});
  da.push({h:'Staff Time',hx:P2+'Staff',v:a=>g(a)?g(a).st:null,r:a=>{const x=g(a);return x&&x.st?HMS(x.st):'–'}},{h:'AUX',hx:P2+'AUX',v:a=>g(a)?g(a).aux:null,r:a=>{const x=g(a);return x&&x.st?HMS(x.aux):'–'}},{h:'AHT',hx:P2+'AHT',v:a=>g(a)&&isN(g(a).aht)?Math.round(g(a).aht):null,r:a=>{const x=g(a);return x?ahp(x.aht):'–'}})}
 const dgrp=[['',1],['Monthly',3],...Array.from({length:n},(_,i)=>[`${i+1} ${m}`,3])];
 const out=sum+'<br><h3>Week-wise CFS</h3>'+tbl('cfsw',wc,rows,note(''),wgrp)+'<br><h3>Week-wise AHT</h3>'+tbl('ahtw',wa,rows,'AHT = total handling time ÷ calls (calls derived from daily AHT tracker). Target '+AHTT+' sec.',wgrp)+'\u0001'+'<br><h3>Day-wise CFS</h3>'+tbl('cfsd',dc,rows,note(''),dgrp)+'<br><h3>Day-wise AHT</h3>'+tbl('ahtd',da,rows,'Staff time, AUX and AHT per day (same layout as Excel). Green = within '+AHTT+' sec.',dgrp);return out.split('\u0001')[part?1:0]}

function render(){const s=S.sec;$('#title').textContent=(SEC.find(x=>x[0]===s)||[])[1];

let pend=null,can=false;

const tkv=()=>{try{return localStorage.getItem('ght')||''}catch(e){return''}};
function upUI(msg){modal(`<h3>Update Data</h3><p class="stamp">Upload the updated Excel workbook. It is read in your browser; nothing is sent anywhere until you confirm.</p><p><input type="file" id="f" accept=".xlsx,.xlsm"></p><p><input type="password" id="pw" placeholder="Workbook password"></p><p><input type="password" id="tk" placeholder="GitHub token (editors only)" value="${esc(tkv())}"></p>${msg?`<p class="err">${esc(msg)}</p>`:''}<p id="pr" class="stamp"></p><div style="display:flex;gap:8px"><button class="btn" data-a="read">Read workbook</button><button class="btn sec" data-a="close">Cancel</button></div>`)}
async function read(){const f=$('#f').files[0],pw=$('#pw').value;try{const t=$('#tk').value.trim();if(t)localStorage.setItem('ght',t)}catch(e){}if(!f)return upUI('Choose an Excel file first.');const pr=m=>{const e=$('#pr');if(e)e.textContent=m};
 try{pr('Reading file…');const b=new Uint8Array(await f.arrayBuffer());if(typeof XLSX==='undefined')throw Object.assign(new Error('Spreadsheet reader failed to load. Check your connection and retry.'),{code:'lib'});
  const d=await Decrypt.decrypt(b,pw,p=>pr('Unlocking… '+Math.round(p*100)+'%'));const r=Parse.parse(XLSX,d.bytes,pr);pend=r;
  modal(`<h3>Preview</h3><p>✅ <b>${r.meta.agents}</b> agents found (${r.meta.regular} regular, ${r.meta.ojt} OJT)<br>Month: <b>${r.meta.month}</b> · Data up to: <b>${r.meta.dataUpTo||'–'}</b><br>Team average score: <b>${N(r.meta.avg,2)}</b></p>${r.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join('')}<p class="stamp">Confirming publishes this data for everyone who opens the link.</p><div style="display:flex;gap:8px"><button class="btn" data-a="confirm">Confirm &amp; publish</button><button class="btn sec" data-a="close">Cancel</button></div>`)}
 catch(e){upUI(e.code==='password'?'Wrong password. Please try again.':e.code==='missing'?'Missing sheet: '+e.message:e.code==='layout'?'Unrecognised layout: '+e.message:'Could not read file: '+e.message)}}
async function confirm(){const r=pend,old=D;const tk=tkv();if(!tk)return upUI('GitHub token dite hobe (shudhu editor-der jonno).');
 const nd={meta:{...r.meta,uploadedAt:Date.now()},agents:r.agents,history:(old.history||[]).concat([{at:Date.now(),month:r.meta.month,upto:r.meta.dataUpTo,n:r.meta.agents,avg:r.meta.avg}]).slice(-60)};
 modal('<p>GitHub-e publish hochche…</p>');
 try{const host=location.hostname,o=CFG.owner||host.split('.')[0],rp=CFG.repo||location.pathname.split('/')[1],br=CFG.branch,api=`https://api.github.com/repos/${o}/${rp}/contents/data.json`,hd={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  const g=await fetch(api+'?ref='+br,{headers:hd});if(g.status===401)throw new Error('Token thik noy ba expire hoyeche.');

  const p=await fetch(api,{method:'PUT',headers:hd,body:JSON.stringify({message:'Data update '+r.meta.month+' (up to '+r.meta.dataUpTo+')',content:btoa(unescape(encodeURIComponent(JSON.stringify(nd)))),sha,branch:br})});
  if(!p.ok){const j=await p.json().catch(()=>({}));throw new Error((p.status===403||p.status===404?'Write permission nei, token-e Contents: Read and write lagbe, ar repo name thik thakte hobe. ':'')+(j.message||p.status))}
  D=nd;render();modal('<p>✅ GitHub-e commit hoyeche. Public link-e proy 1 minute-e live hobe (GitHub Pages rebuild).</p><button class="btn" data-a="close">OK</button>')}catch(e){upUI('Publish failed: '+e.message)}}
document.addEventListener('click',e=>{const t=e.target.closest('button,th');if(!t)return;
 if(t.classList.contains('btn')){const r=document.createElement('span'),b=t.getBoundingClientRect(),z=Math.max(b.width,b.height);r.className='rip';r.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-b.left-z/2}px;top:${e.clientY-b.top-z/2}px`;t.appendChild(r);setTimeout(()=>r.remove(),600)}
 const a=t.dataset.a;if(t.dataset.n){if(S.sec!==t.dataset.n){const f=$('#fly');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}S.sec=t.dataset.n;render()}else if(t.dataset.s){const[i,c]=t.dataset.s.split('|'),x=TB[i];x.d=x.sk==+c?-x.d:1;x.sk=+c;$('#tb-'+i).innerHTML=tbody(i)}else if(t.dataset.x)exp(t.dataset.x);
