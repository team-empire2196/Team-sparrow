<style>
:root{--bg:#f1f8ff;--card:#fff;--ink:#0f2338;--mut:#58718a;--line:#d3e5f6;--p1:#1565a8;--p2:#2e93dc;--p3:#8fd0fb;--soft:#e2f1fd;--g:#2e8b57;--w:#d98e04;--c:#c0392b;--gold:#e3a72f;--sh:0 1px 3px rgba(20,70,120,.1);color-scheme:light}
:root[data-theme=dark]{--bg:#0a1827;--card:#11263a;--ink:#e8f3fd;--mut:#9bb8d1;--line:#22425e;--p1:#66b8f6;--p2:#3b97df;--p3:#2a6fa8;--soft:#16304a;--g:#4cc38a;--w:#f0b43c;--c:#ee6a5a;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1827;--card:#11263a;--ink:#e8f3fd;--mut:#9bb8d1;--line:#22425e;--p1:#66b8f6;--p2:#3b97df;--p3:#2a6fa8;--soft:#16304a;--g:#4cc38a;--w:#f0b43c;--c:#ee6a5a;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#0d4f8f,#3aa6ec);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s .9s,visibility 0s 1.5s}
#splash svg{width:96px;height:96px;animation:pop .8s ease both}#splash h1{margin:14px 0 0;font-size:26px;letter-spacing:.5px;animation:pop .8s .2s ease both}#splash.out{opacity:0;visibility:hidden}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
nav{width:230px;background:linear-gradient(180deg,#0e4d8a,#2f97df);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:transform .25s}
nav .br{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700;font-size:16px}nav .br svg{width:38px;height:38px;flex:none}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#e3f2ff;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;margin:2px 0;transition:background .2s,transform .2s}
nav button:hover{background:rgba(255,255,255,.12);transform:translateX(2px)}nav button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--gold)}
main{flex:1;min-width:0;padding:16px 20px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
header h2{margin:0;font-size:22px}.stamp{color:var(--mut);font-size:12px}
#menu{display:none}
.btn{position:relative;overflow:hidden;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,120,200,.3)}.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s linear;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
#flock{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.bird{position:absolute;opacity:0;animation-name:bfly;animation-timing-function:ease-in-out;animation-fill-mode:both;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}

 for(let d=1;d<=n;d++){let cs=0,ds=0,st=0,au=0,h=0,c=0,hc=0,ha=0;D.agents.forEach(a=>{const x=a.cfs&&a.cfs.days.find(z=>z.d===d);if(x){cs+=x.cs;ds+=x.ds}const y=a.aht&&a.aht.days.find(z=>z.d===d);if(y){st+=y.st||0;au+=y.aux||0;if(isN(y.aht)&&y.aht>0){const q=(y.st||0)-(y.aux||0);h+=q;c+=q/y.aht}}});
  cd.push({d,cs,ds,sc:cs+ds?cs/(cs+ds):null});ad.push({d,st,aux:au,aht:c?h/c:null});c1+=cs;c2+=ds;S1+=st;A1+=au;H+=h;C+=c}
 return{name:'TEAM TOTAL',cfs:{m:{cs:c1,ds:c2,sc:c1+c2?c1/(c1+c2):null},days:cd},aht:{m:{st:S1,aux:A1,aht:C?H/C:null},days:ad}}}

const wkA=(a,w)=>{if(!a.aht)return null;const x=a.aht.days.filter(z=>z.d>=w[0]&&z.d<=w[1]),st=x.reduce((s,z)=>s+(z.st||0),0),au=x.reduce((s,z)=>s+(z.aux||0),0);let h=0,c=0;x.forEach(z=>{if(isN(z.aht)&&z.aht>0){const q=(z.st||0)-(z.aux||0);h+=q;c+=q/z.aht}});return{st,au,aht:c?h/c:null}};
const scp=sc=>isN(sc)?pill(sc>=.9?'g':sc>=.85?'w':'c',(sc*100).toFixed(1)+'%'):'–',ahp=v=>isN(v)?pill(v<=AHTT?'g':'c',Math.round(v)):'–';

 const wc=[nameC],wa=[nameC];wg.forEach((w,i)=>{const L='W'+(i+1);wc.push({h:'CSAT',hx:L+' CSAT',v:a=>(wkC(a,w)||{}).cs},{h:'DSAT',hx:L+' DSAT',v:a=>(wkC(a,w)||{}).ds},{h:'Score',hx:L+' Score',v:a=>{const x=wkC(a,w);return x&&isN(x.sc)?Math.round(x.sc*1000)/10:null},r:a=>{const x=wkC(a,w);return x?scp(x.sc):'–'}});

 for(let d=1;d<=n;d++){const f=a=>a.cfs&&a.cfs.days.find(z=>z.d===d),g=a=>a.aht&&a.aht.days.find(z=>z.d===d),P2='D'+d+' ';
  dc.push({h:'CSAT',hx:P2+'CSAT',v:a=>f(a)?f(a).cs:null},{h:'DSAT',hx:P2+'DSAT',v:a=>f(a)?f(a).ds:null},{h:'Score',hx:P2+'Score',v:a=>f(a)&&isN(f(a).sc)?Math.round(f(a).sc*1000)/10:null,r:a=>{const x=f(a);return x&&x.cs+x.ds>0?scp(x.sc):'–'}});
  da.push({h:'Staff Time',hx:P2+'Staff',v:a=>g(a)?g(a).st:null,r:a=>{const x=g(a);return x&&x.st?HMS(x.st):'–'}},{h:'AUX',hx:P2+'AUX',v:a=>g(a)?g(a).aux:null,r:a=>{const x=g(a);return x&&x.st?HMS(x.aux):'–'}},{h:'AHT',hx:P2+'AHT',v:a=>g(a)&&isN(g(a).aht)?Math.round(g(a).aht):null,r:a=>{const x=g(a);return x?ahp(x.aht):'–'}})}
 const dgrp=[['',1],['Monthly',3],...Array.from({length:n},(_,i)=>[`${i+1} ${m}`,3])];
 const out=sum+'<br><h3>Week-wise CFS</h3>'+tbl('cfsw',wc,rows,note(''),wgrp)+'<br><h3>Week-wise AHT</h3>'+tbl('ahtw',wa,rows,'AHT = total handling time ÷ calls (calls derived from daily AHT tracker). Target '+AHTT+' sec.',wgrp)+'\u0001'+'<br><h3>Day-wise CFS</h3>'+tbl('cfsd',dc,rows,note(''),dgrp)+'<br><h3>Day-wise AHT</h3>'+tbl('ahtd',da,rows,'Staff time, AUX and AHT per day (same layout as Excel). Green = within '+AHTT+' sec.',dgrp);return out.split('\u0001')[part?1:0]}
