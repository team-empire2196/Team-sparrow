<script>
const Decrypt=(()=>{
const u32=(b,o)=>b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24>>>0;
function cfb(b){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);const ss=1<<dv.getUint16(30,true),ms=1<<dv.getUint16(32,true);
 const nfat=dv.getUint32(44,true),dir0=dv.getUint32(48,true),cut=dv.getUint32(56,true),mf=dv.getUint32(60,true);
 const sec=i=>b.subarray(512+i*ss,512+(i+1)*ss);
 const difat=[];for(let i=0;i<109;i++){const v=dv.getUint32(76+i*4,true);if(v<0xFFFFFFFA)difat.push(v)}
 let ds=dv.getUint32(68,true),nd=dv.getUint32(72,true);while(nd--&&ds<0xFFFFFFFA){const s=sec(ds),d=new DataView(s.buffer,s.byteOffset,ss);for(let i=0;i<ss/4-1;i++){const v=d.getUint32(i*4,true);if(v<0xFFFFFFFA)difat.push(v)}ds=d.getUint32(ss-4,true)}
 const fat=[];difat.slice(0,nfat).forEach(i=>{const s=sec(i),d=new DataView(s.buffer,s.byteOffset,ss);for(let j=0;j<ss/4;j++)fat.push(d.getUint32(j*4,true))});
 const chain=(s,tab)=>{const r=[];while(s<0xFFFFFFFA&&r.length<1e6){r.push(s);s=tab[s]}return r};
 const rd=s=>{const ch=chain(s,fat),o=new Uint8Array(ch.length*ss);ch.forEach((c,i)=>o.set(sec(c),i*ss));return o};
 const dir=rd(dir0),ents=[];for(let i=0;i<dir.length/128;i++){const e=dir.subarray(i*128,i*128+128),l=e[64]|e[65]<<8;let n='';for(let j=0;j<l/2-1;j++)n+=String.fromCharCode(e[j*2]|e[j*2+1]<<8);ents.push({n,t:e[66],s:u32(e,116),z:u32(e,120)})}
 const root=ents[0],mini=rd(root.s);let mfat=[];if(mf<0xFFFFFFFA){const m=rd(mf),d=new DataView(m.buffer);for(let i=0;i<m.length/4;i++)mfat.push(d.getUint32(i*4,true))}
 return n=>{const e=ents.find(x=>x.n===n&&x.t===2);if(!e)return null;if(e.z<cut){const ch=chain(e.s,mfat),o=new Uint8Array(ch.length*ms);ch.forEach((c,i)=>o.set(mini.subarray(c*ms,(c+1)*ms),i*ms));return o.subarray(0,e.z)}return rd(e.s).subarray(0,e.z)}}

async function decrypt(bytes,pw,prog){

 if(!info||!pkg){const e=new Error('File is not a valid Excel workbook.');e.code='layout';throw e}
 if(info[0]!==4||info[2]!==4&&info[2]!==3){const e=new Error('Unsupported encryption type (only Excel 2010+ password encryption is supported).');e.code='layout';throw e}
 const xs=new TextDecoder().decode(info.subarray(8)),tag=n=>{const m=xs.match(new RegExp('<([a-zA-Z]+:)?'+n+'[ \t\r\n][^>]*>'))[0];return{getAttribute:a=>(m.match(new RegExp('[ \t\r\n]'+a+'="([^"]*)"'))||[])[1]}};
 const kd=tag('keyData'),ek=tag('encryptedKey');
 const H=AL[ek.getAttribute('hashAlgorithm')],hash=async d=>new Uint8Array(await sub.digest(H,d));
 const salt=b64(ek.getAttribute('saltValue')),spin=+ek.getAttribute('spinCount'),kb=ek.getAttribute('keyBits')/8,bs=+ek.getAttribute('blockSize');
 const pwb=new Uint8Array(pw.length*2);for(let i=0;i<pw.length;i++){pwb[i*2]=pw.charCodeAt(i)&255;pwb[i*2+1]=pw.charCodeAt(i)>>8}
 let h=await hash(cat(salt,pwb));for(let i=0;i<spin;i++){h=await hash(cat(le(i),h));if(prog&&i%20000===0)prog(i/spin)}

  return new Uint8Array(await sub.decrypt({name:'AES-CBC',iv},k,cat(data,pad)))};

const Parse=(()=>{
const nn=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const num=v=>typeof v==='number'&&isFinite(v)?v:(typeof v==='string'&&v.trim()!==''&&isFinite(+v)?+v:null);
const sec=v=>typeof v==='number'?Math.round(v*86400):null;
const dOf=v=>typeof v==='number'?new Date(Math.round((v-25569)*864e5)):null;
const err=(code,msg)=>{const e=new Error(msg);e.code=code;return e};
const PARAMS=[['Critical Error %',7,8,9,'p',1],['Empathy',10,11,12,'p',0],['FCR',13,14,15,'p',0],['Complaint Escalation Accuracy',16,17,18,'p',0],['Service Delivery',19,20,21,'n',0],['Schedule Adherence',22,23,24,'p',0],['Login Compliance',null,28,29,'p',0],['AHT (sec)',30,31,32,'n',1],['CSAT / CFS',33,34,35,'p',0],['Break (extra)',null,37,38,'d',1],['DKB Attendance',null,39,40,'p',0],['Quiz Score',null,41,42,'p',0]];
function parse(XLSX,bytes,log){
 const say=m=>log&&log(m);
 say('Reading workbook');
 const names=XLSX.read(bytes,{type:'array',bookSheets:true}).SheetNames;
 const pick=(pred)=>names.find(n=>pred(nn(n)));
 const S={kpi:pick(n=>n==='kpi'),cfs:pick(n=>n.includes('daywise')&&n.includes('cfs')),aht:pick(n=>n.includes('daywise')&&n.includes('aht')),ce:pick(n=>n.includes('dkb')),fq:pick(n=>n.includes('fcr')),esc:pick(n=>n.includes('escalation')),ort:pick(n=>n==='ort'),att:pick(n=>n.startsWith('attendance'))};
 const warnings=[];
 if(!S.kpi)throw err('missing','Required sheet "KPI" was not found. Sheets in file: '+names.join(', '));
 const want=Object.values(S).filter(Boolean);
 const lab={cfs:'Day Wise CFS Tracker',aht:'Day Wise AHT Tracker',ce:'Quality & DKB report (CE & DKB)',fq:'FCR & Quiz',esc:'Escalation Accuracy',ort:'ORT',att:'Attendance'};
 for(const k in lab)if(!S[k])warnings.push('Sheet missing: '+lab[k]+' – related sections will show no data.');
 say('Parsing sheets');
 const wb=XLSX.read(bytes,{type:'array',sheets:want});
 const R=n=>n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
 const k=R(S.kpi);
 const h0=k.findIndex(r=>r[0]==='ID'&&nn(r[1])==='name');
 if(h0<0)throw err('layout','KPI sheet layout not recognised: header row with "ID" and "Name" not found.');
 const agents=[];let grp='Regular';
 for(let i=h0+1;i<k.length;i++){const r=k[i];
  if(typeof r[0]==='string'){if(/tl\s*kpi/i.test(r[0]))break;if(/ojt/i.test(r[0]))grp='OJT';else if(/regular/i.test(r[0]))grp='Regular';continue}
  if(typeof r[0]!=='number'||typeof r[1]!=='string')continue;
  const kp=PARAMS.map(([nm,t,a,s,f,low])=>({k:nm,t:t==null?null:r[t],v:r[a],s:num(r[s]),f,low}));
  agents.push({id:String(r[0]),name:r[1].trim(),tl:r[2],grp,elig:r[3],roster:num(r[4]),pres:num(r[5]),abs:num(r[6]),kpi:kp,lag:r[27],ready:sec(r[26]),target:sec(r[25]),tot:num(r[43]),score:num(r[44]),final:num(r[45]),grade:r[46],ce:null,dkb:null,fcr:null,quiz:null,ort:null,esc:null,cfs:null,aht:null,att:[]})}
 if(!agents.length)throw err('layout','No agents found in the KPI sheet.');
 const byId={},byName={};agents.forEach(a=>{byId[a.id]=a;byName[nn(a.name)]=a});
 const A=(id,name)=>(id!=null&&byId[String(id).trim()])||byName[nn(name)];
 let monthD=null;
 const c=R(S.cfs);

 try{pr('Reading file…');const b=new Uint8Array(await f.arrayBuffer());if(typeof XLSX==='undefined')throw Object.assign(new Error('Spreadsheet reader failed to load. Check your connection and retry.'),{code:'lib'});

  modal(`<h3>Preview</h3><p>✅ <b>${r.meta.agents}</b> agents found (${r.meta.regular} regular, ${r.meta.ojt} OJT)<br>Month: <b>${r.meta.month}</b> · Data up to: <b>${r.meta.dataUpTo||'–'}</b><br>Team average score: <b>${N(r.meta.avg,2)}</b></p>${r.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join('')}<p class="stamp">Download korle data.json file pabe. Seta GitHub-e upload korle sobai notun data dekhbe.</p><div style="display:flex;gap:8px"><button class="btn" data-a="confirm">Download data.json</button><button class="btn sec" data-a="close">Cancel</button></div>`)}
 catch(e){upUI(e.code==='password'?'Wrong password. Please try again.':e.code==='missing'?'Missing sheet: '+e.message:e.code==='layout'?'Unrecognised layout: '+e.message:'Could not read file: '+e.message)}}

 const u=URL.createObjectURL(new Blob([JSON.stringify(nd)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);
