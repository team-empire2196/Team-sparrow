<style>
:root{--bg:#f1f8ff;--card:#fff;--ink:#0f2338;--mut:#58718a;--line:#d3e5f6;--p1:#1565a8;--p2:#2e93dc;--p3:#8fd0fb;--soft:#e2f1fd;--g:#2e8b57;--w:#d98e04;--c:#c0392b;--gold:#e3a72f;--sh:0 1px 3px rgba(20,70,120,.1);color-scheme:light}
:root[data-theme=dark]{--bg:#0a1827;--card:#11263a;--ink:#e8f3fd;--mut:#9bb8d1;--line:#22425e;--p1:#66b8f6;--p2:#3b97df;--p3:#2a6fa8;--soft:#16304a;--g:#4cc38a;--w:#f0b43c;--c:#ee6a5a;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1827;--card:#11263a;--ink:#e8f3fd;--mut:#9bb8d1;--line:#22425e;--p1:#66b8f6;--p2:#3b97df;--p3:#2a6fa8;--soft:#16304a;--g:#4cc38a;--w:#f0b43c;--c:#ee6a5a;--sh:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh}
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#0d4f8f,#3aa6ec);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s .9s,visibility 0s 1.5s}
#splash svg{width:96px;height:96px;animation:pop .8s ease both}#splash h1{margin:14px 0 0;font-size:26px;letter-spacing:.5px;animation:pop .8s .2s ease both}#splash.out{opacity:0;visibility:hidden}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
nav{width:230px;background:linear-gradient(180deg,#0e4d8a,#2f97df);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:transform .25s}
nav .br{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700;font-size:16px}nav .br svg{width:38px;height:38px;flex:none}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#e3f2ff;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;margin:2px 0;transition:background .2s,transform .2s}
nav button:hover{background:rgba(255,255,255,.12);transform:translateX(2px)}nav button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--gold)}
main{flex:1;min-width:0;padding:16px 20px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
header h2{margin:0;font-size:22px}.stamp{color:var(--mut);font-size:12px}
#menu{display:none}
.btn{position:relative;overflow:hidden;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,120,200,.3)}.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s linear;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
#flock{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.bird{position:absolute;opacity:0;animation-name:bfly;animation-timing-function:ease-in-out;animation-fill-mode:both;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
@keyframes bfly{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}33%{transform:translate(var(--x1),var(--y1)) rotate(25deg)}66%{transform:translate(var(--x2),var(--y2)) rotate(-30deg)}92%{opacity:1}100%{opacity:0;transform:translate(var(--x3),var(--y3)) rotate(20deg)}}
.bw path{fill:var(--c)}.bw{transform-origin:32px 32px;animation:bflap .2s infinite alternate ease-in-out}@keyframes bflap{to{transform:scaleX(.3)}}
.slogo{width:min(320px,72vw);border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.3);animation:pop .8s ease both}.bi{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
body.locked nav,body.locked main{display:none}
#login{display:none;position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#f8f1e4,#dff0fd 60%,#bfe0f8);align-items:center;justify-content:center;overflow:hidden;padding:16px}body.locked #login{display:flex}
.lbox{position:relative;z-index:2;width:min(380px,100%);background:rgba(255,255,255,.9);border-radius:24px;padding:22px;text-align:center;box-shadow:0 18px 50px rgba(30,90,150,.25)}
.lbox img{width:min(230px,66%);border-radius:20px}.lbox input{width:100%;margin:6px 0;padding:11px 12px;color:#10243a;background:#fff;border:1px solid #cfe1f2}.lbox .btn{width:100%;margin-top:8px;padding:11px}.lerr{color:#c0392b;min-height:18px;font-size:13px}
.lbf{position:absolute;z-index:1;animation:lupdown 4s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
@keyframes lupdown{0%{transform:translate(0,-30px) rotate(-10deg)}50%{transform:translate(18px,6px) rotate(8deg)}100%{transform:translate(-10px,32px) rotate(-6deg)}}.hero{background:linear-gradient(135deg,#0d4f8f,#3aa6ec);color:#fff;border-radius:16px;padding:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0;box-shadow:0 8px 22px rgba(20,100,170,.25)}
.av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.hero h2{margin:0;font-size:20px}.hero small{opacity:.9}.hs{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}.hs div{background:rgba(255,255,255,.17);border-radius:12px;padding:8px 14px;text-align:center;min-width:78px}.hs b{display:block;font-size:22px}
.kg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));margin-bottom:14px}
.kc{border-left:5px solid var(--sc,var(--line))}.kc.click{cursor:pointer}.kc.click:hover{box-shadow:0 8px 20px rgba(30,110,190,.24)}.kc .big{font-size:26px;font-weight:700;color:var(--p1);margin:2px 0}.kc .go{font-size:11px;color:var(--p2);font-weight:700;margin-top:4px}.kc .ico{font-size:20px}.kc .row span:first-child{width:62px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.ac{cursor:pointer;display:flex;gap:12px;align-items:center}.ac .av{width:46px;height:46px;font-size:16px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.pnl{border:2px solid var(--p2);background:linear-gradient(180deg,var(--soft),var(--card));margin-bottom:14px}.pnl .card{box-shadow:none}
.sec{animation:fi .4s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,100,170,.16)}
.tile .l{color:var(--mut);font-size:12px}.tile b{display:block;font-size:24px;color:var(--p1);margin-top:2px}.tile small{color:var(--mut);font-size:11px}
h3{margin:0 0 10px;font-size:15px;color:var(--p1)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:6px;transition:width 1s ease}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row span:first-child{width:130px;flex:none;font-size:12px}.row .bar{flex:1}.row em{width:48px;text-align:right;font-style:normal;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pg{background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--g)}.pw{background:color-mix(in srgb,var(--w) 20%,transparent);color:var(--w)}.pc{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}.pn{background:var(--soft);color:var(--mut)}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--card);z-index:1}.mx th:first-child{background:var(--soft)}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--p1);cursor:pointer;position:sticky;top:0;user-select:none}tr:hover td{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tb{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}
.aw{display:flex;gap:10px;align-items:center}.aw .ic{font-size:26px}.gold{color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{border-radius:8px;padding:6px 2px;text-align:center;font-size:12px;border:1px solid var(--line)}.cal .P{background:color-mix(in srgb,var(--g) 18%,transparent)}.cal .A{background:color-mix(in srgb,var(--c) 20%,transparent)}.cal .O{background:var(--soft);color:var(--mut)}
svg.ch{width:100%;height:auto;display:block}.dr{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dw 1.4s ease forwards}@keyframes dw{to{stroke-dashoffset:0}}
#modal{position:fixed;inset:0;background:rgba(5,20,35,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#modal.on{display:flex}#modal .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.warn{color:var(--w);font-size:12px}.err{color:var(--c);font-weight:600}
@media(max-width:800px){nav{position:fixed;z-index:40;transform:translateX(-105%);left:0;top:0}nav.on{transform:none}#menu{display:inline-block}main{padding:12px}}
@media(prefers-reduced-motion:reduce){#flock{display:none}*{animation:none!important;transition:none!important}.dr{stroke-dashoffset:0}#splash{display:none}}
